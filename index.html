}

/* ============================================================================
   ███ initLakeLotus —— 兰花指 湖心莲绽（莲花+波纹+飘瓣）
============================================================================ */
function initLakeLotus() {
  const islandC = CONFIG.lm.pengdao.c, bridgeC = CONFIG.lm.bridge.c;
  // 花心分布：环岛湖面 18 朵 + 九曲桥湖面 8 朵
  const centers = [];
  for (let i = 0; i < 18; i++) { const a = i / 18 * 6.2832 + rnd(-.15, .15), r = rnd(25, 40); centers.push([islandC.x + Math.cos(a) * r, islandC.z + Math.sin(a) * r]); }
  for (let i = 0; i < 8; i++) { const a = rnd(0, 6.2832), r = rnd(9, 18); centers.push([bridgeC.x - 12 + Math.cos(a) * r, bridgeC.z + Math.sin(a) * r]); }
  const A = [], CD = [], CN = [], SZ = [], SD = [], KD = [], ST = [], RAD = [];
  let n = 0;
  const push = (c, kind, size, cd, cn, stagger, rad) => {
    A.push(c[0], 0.5, c[1]); KD.push(kind); SZ.push(size); SD.push(Math.random());
    ST.push(stagger); RAD.push(rad); CD.push(...cd); CN.push(...cn); n++;
  };
  const petD = [1.0, 0.72, 0.78], petN = [1.15, 0.8, 0.9];
  const whiteD = [1.0, 0.92, 0.85], whiteN = [1.1, 1.0, 0.9];
  const ripD = [0.5, 0.75, 0.85], ripN = [0.45, 0.8, 0.98];
  const perFlower = Math.floor(CONFIG.count.lakeLotus * 0.62 / centers.length);
  const perRipple = Math.floor(CONFIG.count.lakeLotus * 0.22 / centers.length);
  const perDrift = Math.floor(CONFIG.count.lakeLotus * 0.16 / centers.length);
  for (const c of centers) {
    for (let i = 0; i < perFlower; i++) {         // 花瓣
      const white = Math.random() < 0.35;
      push(c, 0, rnd(1.0, 1.6), white ? whiteD : petD, white ? whiteN : petN, Math.random(), rnd(1.6, 3.0));
    }
    for (let i = 0; i < perRipple; i++) push(c, 1, rnd(0.9, 1.4), ripD, ripN, 0, rnd(0.7, 1.3));  // 波纹
    for (let i = 0; i < perDrift; i++) push(c, 2, rnd(0.9, 1.4), petD, petN, Math.random(), 1);   // 飘瓣
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(A, 3));
  g.setAttribute('aPosA', new THREE.Float32BufferAttribute(A, 3));
  g.setAttribute('aColorDay', new THREE.Float32BufferAttribute(CD, 3));
  g.setAttribute('aColorNight', new THREE.Float32BufferAttribute(CN, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(SZ, 1));
  g.setAttribute('aSeed', new THREE.Float32BufferAttribute(SD, 1));
  g.setAttribute('aKind', new THREE.Float32BufferAttribute(KD, 1));
  g.setAttribute('aStagger', new THREE.Float32BufferAttribute(ST, 1));
  g.setAttribute('aRad', new THREE.Float32BufferAttribute(RAD, 1));
  matLotus = new THREE.ShaderMaterial({
    vertexShader: VERT_LOTUS, fragmentShader: FRAG_GLOW,
    uniforms: { uTime: { value: 0 }, uNight: { value: 0 }, uPR: { value: 1 }, uLotusT: { value: -1 } },
    transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending
  });
  pointsLotus = new THREE.Points(g, matLotus);
  pointsLotus.frustumCulled = false;
  TOTAL += n;
  scene.add(pointsLotus);
}

/* ============================================================================
   ███ initHiddenEasterEgg —— 海岳开襟：鎏金莲花 + 萤火 + 粒子古诗
============================================================================ */
function initHiddenEasterEgg() {
  const C = CONFIG.lm.egg.c;
  const A = [], B = [], CD = [], CN = [], SZ = [], SD = [], KD = [], RISE = [];
  let n = 0;
  const push = (ax, ay, az, bx, by, bz, kind, size, cd, cn, rise = 0) => {
    A.push(ax, ay, az); B.push(bx, by, bz); KD.push(kind); SZ.push(size);
    SD.push(Math.random()); CD.push(...cd); CN.push(...cn); RISE.push(rise); n++;
  };
  const petalD = [1.0, 0.8, 0.42], petalN = [1.25, 0.95, 0.55];
  const heartD = [1.0, 0.65, 0.5], heartN = [1.3, 0.9, 0.7];
  const goldD = [1.05, 0.85, 0.45], goldN = [1.3, 1.0, 0.55];
  const buildLotus = (petals, len, wid, lift, seedOff) => {
    const per = Math.floor(CONFIG.count.lotus * 0.6 / (14 + 10));
    for (let k = 0; k < petals; k++) {
      const th = k / petals * 6.2832 + seedOff;
      const dx = Math.cos(th), dz = Math.sin(th);
      const px = -dz, pz = dx;
      for (let i = 0; i < per; i++) {
        const t = Math.pow(Math.random(), 0.8), u = rnd(-1, 1);
        const wProf = Math.sin(Math.PI * t) * wid;
        const ax = dx * (t * 0.5) + px * u * wProf * 0.18;
        const ay = 0.4 + t * len * 1.05;
        const az = dz * (t * 0.5) + pz * u * wProf * 0.18;
        const rr = t * len * 0.72;
        const bloomY = Math.sin(t * 1.35) * lift + t * 1.2;
        const bx = dx * rr + px * u * wProf;
        const by = 0.4 + bloomY + Math.abs(u) * t * 1.1;
        const bz = dz * rr + pz * u * wProf;
        push(C.x + ax, ay, C.z + az, C.x + bx, by, C.z + bz, 0, rnd(1.0, 1.6), petalD, petalN, rnd(0.5, 2.2));
      }
    }
  };
  buildLotus(14, 8.2, 2.6, 4.6, 0);
  buildLotus(10, 5.6, 1.9, 3.2, 0.22);
  for (let i = 0; i < CONFIG.count.stamen; i++) {
    const a = rnd(0, 6.2832), rr = Math.pow(Math.random(), 0.6) * 1.6;
    push(C.x + Math.cos(a) * rr * 0.2, 0.6 + rr * 2.2, C.z + Math.sin(a) * rr * 0.2,
         C.x + Math.cos(a) * rr, 6.4 + rnd(0, 2.4), C.z + Math.sin(a) * rr,
         0, rnd(0.9, 1.4), heartD, heartN, rnd(1, 2.5));
  }
  for (let i = 0; i < CONFIG.count.eggFly; i++) {
    push(C.x, 2.0, C.z, C.x, 2.0, C.z, 1, rnd(0.9, 1.6), goldD, goldN);
  }
  {
    const cv = document.createElement('canvas');
    cv.width = 1024; cv.height = 300;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 92px "KaiTi","STKaiti","Noto Serif SC",serif';
    ctx.fillText(CONFIG.egg.poem[0], 512, 80);
    ctx.fillText(CONFIG.egg.poem[1], 512, 210);
    const data = ctx.getImageData(0, 0, 1024, 300).data;
    const worldW = 58, scale = worldW / 1024;
    for (let y = 0; y < 300; y += 3) for (let x = 0; x < 1024; x += 3) {
      if (data[(y * 1024 + x) * 4 + 3] > 120) {
        const wx = C.x + (x - 512) * scale;
        const wy = 26 + (150 - y) * scale * 1.05;
        const wz = C.z + 2;
        push(wx, 0.4, wz, wx, wy, wz, 2, rnd(0.9, 1.4), goldD, goldN);
      }
    }
    CONFIG.count.poem = n;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(A, 3));
  g.setAttribute('aPosA', new THREE.Float32BufferAttribute(A, 3));
  g.setAttribute('aPosB', new THREE.Float32BufferAttribute(B, 3));
  g.setAttribute('aColorDay', new THREE.Float32BufferAttribute(CD, 3));
  g.setAttribute('aColorNight', new THREE.Float32BufferAttribute(CN, 3));
  g.setAttribute('aSize', new THREE.Float32BufferAttribute(SZ, 1));
  g.setAttribute('aSeed', new THREE.Float32BufferAttribute(SD, 1));
  g.setAttribute('aKind', new THREE.Float32BufferAttribute(KD, 1));
  g.setAttribute('aRise', new THREE.Float32BufferAttribute(RISE, 1));
  matEgg = new THREE.ShaderMaterial({
    vertexShader: VERT_EGG, fragmentShader: FRAG_GLOW,
    uniforms: { uTime: { value: 0 }, uNight: { value: 0 }, uPR: { value: 1 }, uEggT: { value: -1 } },
    transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending
  });
  pointsEgg = new THREE.Points(g, matEgg);
  pointsEgg.frustumCulled = false;
  pointsEgg.visible = false;
  TOTAL += n;
  scene.add(pointsEgg);
}

/* ============================================================================
   ███ initDayNightMode —— 昼夜切换（2s 平滑过渡 + 宫门音效）
============================================================================ */
function initDayNightMode() {
  state.nightTarget = state.nightTarget === 1 ? 0 : 1;
  const toNight = state.nightTarget === 1;
  showToast(toNight ? '白昼盛景 → 灯火夜游模式' : '灯火夜游 → 白昼盛景');
  document.body.classList.toggle('night', toNight);
  document.getElementById('hMode').textContent = toNight ? '灯火夜游' : '白昼盛景';
  sfxDoor();
}

/* ============================================================================
   ███ initMediaPipe —— HandLandmarker 双手追踪
============================================================================ */
const hand = {
  detected: false, gesture: 'none', holdGesture: 'none', holdStart: 0, fired: false,
  scale: 0, baseline: 0, palmX: 0.5, palmY: 0.5, landmarks: null,
  // 双手状态
  combo: 'none', comboSince: 0, comboFired: false, comboBase: 0,
  circleBuf: [], circleDir: 0, fistStillBuf: [],
  sfxArmed: { bell: true, jade: true, whooshUp: true, whooshDown: true }
};
let landmarker = null;
const GESTURE_NAME = { open:'张开手掌', fist:'握拳', thumbs:'竖大拇指', victory:'比耶手势', ok:'OK 手势', orchid:'兰花指', none:'未检测' };
const COMBO_NAME = {
  spread:'双手舒展 · 雾散景清', fog:'双拳合拢 · 暮雾升腾', circle:'云台转景 · 画圈巡游',
  orchid:'兰亭点水 · 莲绽湖心', petal:'双手OK · 鎏金花瓣雨'
};
const COMBO_SHORT = { spread:'舒展·雾散', fog:'合拢·雾起', circle:'画圈巡游', orchid:'莲绽湖心', petal:'花瓣雨' };
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

async function initMediaPipe() {
  const video = document.getElementById('cam');
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('no camera api');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    showToast('摄像头不可用 · 已进入自动巡游模式', false, 3400);
  }
  try {
    const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm');
    landmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO', numHands: 2      // 双手同步追踪（42 地标点）
    });
  } catch (e) {
    showToast('手势模块加载失败 · 已进入自动巡游模式', false, 3400);
  }
}

/* —— 手势分类（单手 21 地标） —— */
function classifyGesture(lm) {
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const ext = (tip, pip) => d(tip, 0) > d(pip, 0) * 1.28;
  const f1 = ext(8, 6), f2 = ext(12, 10), f3 = ext(16, 14), f4 = ext(20, 18);
  const thumbUp = d(4, 17) > d(2, 17) * 1.3 && lm[4].y < lm[2].y - 0.02;
  const nFingers = [f1, f2, f3, f4].filter(Boolean).length;
  const pinch = d(4, 8) < CONFIG.pinchDist && d(4, 8) < d(4, 12);
  const orchid = d(4, 12) < CONFIG.pinchDist * 1.35 && f1 && (f3 || f4) && !pinch;  // 兰花指：拇中相掐、食指外翘
  if (orchid) return 'orchid';
  if (pinch && f2 && f3 && f4) return 'ok';
  if (thumbUp && nFingers === 0 && lm[4].y < lm[0].y - 0.06) return 'thumbs';
  if (f1 && f2 && !f3 && !f4) return 'victory';
  if (nFingers >= 4 || (nFingers >= 3 && thumbUp)) return 'open';
  if (nFingers === 0 && !thumbUp) return 'fist';
  return 'none';
}

/* —— 画圈检测：轨迹累计带符号角度 —— */
function detectCircle(buf) {
  if (buf.length < 12) return 0;
  const cx = buf.reduce((s, p) => s + p.x, 0) / buf.length;
  const cy = buf.reduce((s, p) => s + p.y, 0) / buf.length;
  let acc = 0;
  for (let i = 1; i < buf.length; i++) {
    const a = buf[i - 1], b = buf[i];
    const ax = a.x - cx, ay = a.y - cy, bx = b.x - cx, by = b.y - cy;
    const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by);
    if (la < 0.02 || lb < 0.02) continue;
    acc += Math.atan2(ax * by - ay * bx, ax * bx + ay * by);
  }
  return Math.abs(acc) > CONFIG.twoHand.circleMinAngle ? Math.sign(acc) : 0;
}

/* ============================================================================
   ███ updateHandState —— 每帧：识别 / 防误触 / 连续控制 / 双手组合 / HUD
============================================================================ */
function updateHandState(now, dt) {
  const video = document.getElementById('cam');
  if (!landmarker || video.readyState < 2) return;
  let res = null;
  try { res = landmarker.detectForVideo(video, now); } catch (e) { return; }
  const lms = res?.landmarks;
  if (!lms || !lms.length) {
    if (hand.detected) {
      hand.detected = false; hand.gesture = 'none'; hand.combo = 'none'; hand.circleDir = 0;
      hand.circleBuf.length = 0; hand.fistStillBuf.length = 0;
      document.getElementById('hud').classList.remove('tracking');
      document.getElementById('hGesture').innerHTML = '<span id="statusDot"></span>未检测';
    }
    return;
  }
  if (!hand.detected) {
    showToast('盛景扫描中 · 手已接入');
    document.getElementById('hud').classList.add('tracking');
    sfxScan();
  }
  hand.detected = true;
  hand.landmarks = lms[0];
  state.lastHandT = state.time;

  // —— 逐手信息（最多两手，共 42 地标） ——
  const infos = lms.map(lm => ({
    lm, g: classifyGesture(lm),
    px: 1 - lm[9].x, py: lm[9].y,
    scale: Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y)
  }));
  const primary = infos[0];
  const gesture = primary.g;
  hand.gesture = gesture;
  hand.palmX = primary.px; hand.palmY = primary.py;
  hand.scale = primary.scale;

  /* ============ 双手组合手势（优先判定） ============ */
  let comboContinuous = false;
  let hudGesture = GESTURE_NAME[gesture] || '识别中';
  if (infos.length < 2 && hand.combo !== 'none') {    // 手数不足时重置组合状态，防止目标卡滞
    hand.combo = 'none'; hand.circleDir = 0;
    hand.circleBuf.length = 0; hand.fistStillBuf.length = 0;
  }
  if (infos.length === 2) {
    const [hA, hB] = infos;
    const pd = Math.hypot(hA.px - hB.px, hA.py - hB.py);   // 双掌心距
    let type = 'none';
    if (hA.g === 'open' && hB.g === 'open') type = 'spread';
    else if (hA.g === 'fist' && hB.g === 'fist') type = 'fog';
    else if ((hA.g === 'fist') !== (hB.g === 'fist')) type = 'circle';
    else if (hA.g === 'orchid' && hB.g === 'orchid') type = 'orchid';
    else if (hA.g === 'ok' && hB.g === 'ok') type = 'petal';
    if (type !== hand.combo) { hand.combo = type; hand.comboSince = state.time; hand.comboFired = false; hand.comboBase = pd; }
    const comboHeld = state.time - hand.comboSince >= CONFIG.twoHand.hold;   // 0.5s 防误触
    if (comboHeld) {
      if (type === 'spread') {                       // 双手拉开 → 晨雾散开、远景显现
        comboContinuous = true;
        const pull = pd - hand.comboBase;
        state.spreadTarget = THREE.MathUtils.clamp(pull * CONFIG.twoHand.spreadGain, 0, 1);
        state.fogTarget = 0;
        if (pull > 0.05 && hand.sfxArmed.whooshUp) { sfxWhoosh(true); hand.sfxArmed.whooshUp = false; }
        if (pull < 0.02) hand.sfxArmed.whooshUp = true;
        hudGesture = COMBO_SHORT.spread + (state.spreadTarget > 0.15 ? '·景显' : '');
      } else if (type === 'fog') {                   // 双拳合拢 → 暮雾升腾
        comboContinuous = true;
        const push = hand.comboBase - pd;
        state.fogTarget = THREE.MathUtils.clamp(push * CONFIG.twoHand.fogGain, 0, 1);
        state.spreadTarget = 0;
        if (push > 0.05 && hand.sfxArmed.whooshDown) { sfxWhoosh(false); hand.sfxArmed.whooshDown = false; }
        if (push < 0.02) hand.sfxArmed.whooshDown = true;
        hudGesture = COMBO_SHORT.fog + (state.fogTarget > 0.15 ? '·雾浓' : '');
      } else if (type === 'circle') {                // 一拳定身 + 另一手画圈 → 云台巡游
        const fistHand = hA.g === 'fist' ? hA : hB;
        const drawHand = hA.g === 'fist' ? hB : hA;
        hand.fistStillBuf.push({ x: fistHand.px, y: fistHand.py, t: state.time });
        while (hand.fistStillBuf.length && state.time - hand.fistStillBuf[0].t > 0.6) hand.fistStillBuf.shift();
        const fMove = hand.fistStillBuf.length > 1
          ? Math.hypot(fistHand.px - hand.fistStillBuf[0].x, fistHand.py - hand.fistStillBuf[0].y) : 1;
        hand.circleBuf.push({ x: drawHand.px, y: drawHand.py, t: state.time });
        while (hand.circleBuf.length && state.time - hand.circleBuf[0].t > 1.1) hand.circleBuf.shift();
        if (hand.circleBuf.length > 50) hand.circleBuf.shift();
        const dir = fMove < CONFIG.twoHand.circleStillDist ? detectCircle(hand.circleBuf) : 0;
        hand.circleDir = dir;
        if (dir !== 0) {
          comboContinuous = true;
          hudGesture = COMBO_SHORT.circle + (dir > 0 ? '·顺' : '·逆');
        }
      } else if (type === 'orchid' && !hand.comboFired) {   // 双兰花指 → 湖心莲绽
        hand.comboFired = true;
        state.lotusT0 = state.time;
        sfxWater(); sfxEnsemble();
        showToast(COMBO_NAME.orchid, true);
        hudGesture = COMBO_SHORT.orchid;
      } else if (type === 'petal' && !hand.comboFired) {    // 双OK → 鎏金花瓣雨
        hand.comboFired = true;
        state.petalT = state.time;
        sfxChime(); sfxEnsemble();
        showToast(COMBO_NAME.petal, true, 3000);
        hudGesture = COMBO_SHORT.petal;
      }
    }
    if (type !== 'spread' && type !== 'fog') { /* 松开后目标自然回落 */ }
  }
  if (hand.combo !== 'spread') state.spreadTarget = Math.max(0, state.spreadTarget - dt * 0.4);
  if (hand.combo !== 'fog') state.fogTarget = Math.max(0, state.fogTarget - dt * 0.4);
  if (hand.combo !== 'circle') hand.circleDir = 0;

  /* ============ 原单手逻辑（100% 保留） ============ */
  const suppressDiscrete = infos.length === 2 && (hand.combo === 'petal' || hand.combo === 'orchid');
  const effGesture = suppressDiscrete && gesture === 'ok' ? 'none' : gesture;
  if (effGesture !== hand.holdGesture) { hand.holdGesture = effGesture; hand.holdStart = state.time; hand.fired = false; hand.baseline = hand.scale; }
  const holdTime = state.time - hand.holdStart;
  const engaged = holdTime >= CONFIG.gestureHold;

  if (engaged && !hand.fired) {
    hand.fired = true;
    hand.baseline = hand.scale;
    if (effGesture === 'thumbs') initDayNightMode();
    if (effGesture === 'victory') { state.burstT = state.time; sfxBurst(); showToast('漫天光雨 · 盛景绽放'); }
    if (effGesture === 'ok') {
      const dy = ((cam.yaw - CONFIG.defYaw) % (Math.PI*2) + Math.PI*3) % (Math.PI*2) - Math.PI;
      cam.tYaw = cam.yaw - dy; cam.tPitch = CONFIG.defPitch; cam.tDist = CONFIG.defDist;
      sfxReset();
      showToast('视角复位 · 俯瞰万园之园');
    }
  }

  if (engaged && !comboContinuous) {                  // 组合连续控制时抑制单手连续控制
    if (effGesture === 'open') {
      let vx = hand.palmX - 0.5;
      if (Math.abs(vx) > CONFIG.deadZone) cam.tYaw += (vx - Math.sign(vx)*CONFIG.deadZone) * CONFIG.rotateGain * dt;
      let vy = hand.palmY - 0.5;
      if (Math.abs(vy) > CONFIG.deadZone) cam.tPitch = THREE.MathUtils.clamp(cam.tPitch + (vy > 0 ? -1 : 1) * CONFIG.pitchGain * dt * Math.abs(vy), 0.18, 1.25);
      const push = hand.scale - hand.baseline;
      if (push > CONFIG.pushPullThresh) {
        cam.tDist = Math.max(CONFIG.minDist, cam.tDist - (push - CONFIG.pushPullThresh) * CONFIG.zoomGain * dt * 6);
        if (hand.sfxArmed.jade) { sfxJade(); hand.sfxArmed.jade = false; }
      } else if (push < CONFIG.pushPullThresh * 0.4) hand.sfxArmed.jade = true;
    }
    if (effGesture === 'fist') {
      const pull = hand.baseline - hand.scale;
      if (pull > CONFIG.pushPullThresh) {
        cam.tDist = Math.min(CONFIG.maxDist, cam.tDist + (pull - CONFIG.pushPullThresh) * CONFIG.zoomGain * dt * 6);
        if (hand.sfxArmed.bell) { sfxBell(); hand.sfxArmed.bell = false; }
      } else if (pull < CONFIG.pushPullThresh * 0.4) hand.sfxArmed.bell = true;
      hand.baseline += (hand.scale - hand.baseline) * 0.02;   // 握拳缓慢自适应漂移
    }
    if (effGesture === 'open' && Math.abs(hand.scale - hand.baseline) < 0.02) {
      hand.baseline += (hand.scale - hand.baseline) * 0.02;
    }
  }

  /* —— HUD 手势名（双手组合优先显示） —— */
  const gEl = document.getElementById('hGesture');
  const txt = '<span id="statusDot"></span>' + hudGesture;
  if (gEl.innerHTML !== txt) gEl.innerHTML = txt;

  drawSkeleton(lms);
}

function drawSkeleton(lms) {
  const cv = document.getElementById('skel'), ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = 'rgba(120,220,200,.85)'; ctx.lineWidth = 1.5;
  ctx.fillStyle = 'rgba(255,215,120,.95)';
  for (const lm of lms) {
    ctx.beginPath();
    for (const [a, b] of BONES) {
      ctx.moveTo(lm[a].x * cv.width, lm[a].y * cv.height);
      ctx.lineTo(lm[b].x * cv.width, lm[b].y * cv.height);
    }
    ctx.stroke();
    for (const p of lm) { ctx.beginPath(); ctx.arc(p.x * cv.width, p.y * cv.height, 2.2, 0, 6.2832); ctx.fill(); }
  }
}

/* ============================================================================
   ███ animate —— 主循环
============================================================================ */
function animate() {
  requestAnimationFrame(animate);
  const nowMs = performance.now();
  const dt = Math.min((nowMs - lastNow) / 1000, 0.05);
  lastNow = nowMs;
  state.time += dt;
  const T = state.time;

  /* —— 无手自动巡游 / 画圈巡游 —— */
  if (!hand.detected && T - state.lastHandT > CONFIG.idleOrbitAfter) cam.tYaw += dt * 0.055;
  if (hand.circleDir !== 0) cam.tYaw += hand.circleDir * CONFIG.twoHand.circleSpeed * dt;

  /* —— 相机弹簧阻尼 —— */
  cam.tDist = THREE.MathUtils.clamp(cam.tDist, CONFIG.minDist, CONFIG.maxDist);
  [cam.yaw, cam.vy] = springStep(cam.yaw, cam.vy, cam.tYaw, CONFIG.springK * 0.85, CONFIG.springC, dt);
  [cam.pitch, cam.vp] = springStep(cam.pitch, cam.vp, cam.tPitch, CONFIG.springK, CONFIG.springC, dt);
  [cam.dist, cam.vd] = springStep(cam.dist, cam.vd, cam.tDist, CONFIG.springK, CONFIG.springC, dt);
  const tg = CONFIG.camTarget;
  camera.position.set(
    tg.x + cam.dist * Math.cos(cam.pitch) * Math.sin(cam.yaw),
    tg.y + cam.dist * Math.sin(cam.pitch),
    tg.z + cam.dist * Math.cos(cam.pitch) * Math.cos(cam.yaw)
  );
  camera.lookAt(tg);
  camera.fov = THREE.MathUtils.clamp(
    CONFIG.fovNear + (cam.dist - CONFIG.defDist) / (CONFIG.maxDist - CONFIG.defDist) * (CONFIG.fovFar - CONFIG.fovNear),
    CONFIG.fovNear, CONFIG.fovFar);
  camera.updateProjectionMatrix();

  /* —— 昼夜过渡 —— */
  state.night += THREE.MathUtils.clamp(state.nightTarget - state.night, -dt / CONFIG.nightTransition, dt / CONFIG.nightTransition);
  renderer.setClearColor(new THREE.Color().lerpColors(CONFIG.dayBg, CONFIG.nightBg, state.night));

  /* —— 凑近景观：专属特效强化 —— */
  const boostOf = (c) => {
    const d = Math.hypot(camera.position.x - c.x, camera.position.z - c.z);
    const [near, far] = CONFIG.nearBoostRange;
    return THREE.MathUtils.clamp(1 - (d - near) / (far - near), 0, 1);
  };
  state.boosts.fountain = boostOf(CONFIG.lm.dashuifa.c);
  state.boosts.ripple   = boostOf(CONFIG.lm.pengdao.c);
  state.boosts.lantern  = boostOf(CONFIG.lm.bridge.c);
  state.boosts.firefly  = boostOf(CONFIG.lm.fanghu.c);
  state.wide = THREE.MathUtils.smoothstep(cam.dist, 190, CONFIG.maxDist);

  /* —— 舒展 / 暮雾 平滑跟随 —— */
  state.spread += (state.spreadTarget - state.spread) * Math.min(dt * 2.2, 1);
  state.fog += (state.fogTarget - state.fog) * Math.min(dt * 2.2, 1);

  /* —— 动态辉光：昼随云影缓波 / 夜随灯影明灭 —— */
  state.glow = state.night > 0.5
    ? 0.2 * Math.sin(T * 0.35) * state.night
    : 0.13 * Math.sin(T * 0.12) * (1 - state.night);

  /* —— 隐藏彩蛋 —— */
  const E = CONFIG.lm.egg.c, eg = state.egg;
  const dEgg = Math.hypot(camera.position.x - E.x, camera.position.z - E.z);
  const inZone = dEgg < CONFIG.egg.radius && camera.position.y > CONFIG.egg.minHeight;
  if (!eg.active && !eg.cooldown && inZone) {
    eg.active = true; eg.start = T;
    pointsEgg.visible = true;
    sfxGuzheng();
    showToast('海岳开襟 · 发现新景', true, 3600);
    document.getElementById('hEgg').textContent = '海岳开襟 · 已发现';
  }
  if (eg.active) {
    const p = (T - eg.start) / CONFIG.egg.duration;
    matEgg.uniforms.uEggT.value = Math.min(p, 1);
    if (p >= 1) { eg.active = false; eg.cooldown = true; pointsEgg.visible = false; matEgg.uniforms.uEggT.value = -1; }
  }
  if (eg.cooldown && dEgg > CONFIG.egg.radius * 1.6) eg.cooldown = false;

  /* —— 同步 uniforms —— */
  for (const m of [matMain, matRing, matBg, matEgg, matPetal, matLotus]) {
    m.uniforms.uTime.value = T;
    m.uniforms.uNight.value = state.night;
    m.uniforms.uPR.value = renderer.getPixelRatio();
  }
  matMain.uniforms.uBurstT.value = state.burstT;
  matRing.uniforms.uBurstT.value = state.burstT;
  matMain.uniforms.uFountainBoost.value = state.boosts.fountain;
  matMain.uniforms.uRippleBoost.value = state.boosts.ripple;
  matMain.uniforms.uLanternBoost.value = state.boosts.lantern;
  matMain.uniforms.uFireflyBoost.value = state.boosts.firefly;
  matMain.uniforms.uCamPos.value.copy(camera.position);
  matMain.uniforms.uSpread.value = state.spread;
  matMain.uniforms.uFog.value = state.fog;
  matMain.uniforms.uReveal.value = state.spread;
  matMain.uniforms.uGlow.value = state.glow;
  matRing.uniforms.uWide.value = state.wide;
  matRing.uniforms.uGlow.value = state.glow;
  matBg.uniforms.uWide.value = state.wide;
  matBg.uniforms.uGlow.value = state.glow;
  matBg.uniforms.uCamPos.value.copy(camera.position);
  matPetal.uniforms.uPetalT.value = state.petalT;
  matLotus.uniforms.uLotusT.value = Math.min((T - state.lotusT0) / CONFIG.twoHand.lotusDuration, 1.2);

  /* —— 聚焦景致 —— */
  let focus = '纵览全局', best = 78;
  for (const k of ['dashuifa', 'pengdao', 'bridge', 'fanghu', 'egg']) {
    const L = CONFIG.lm[k];
    const d = Math.hypot(camera.position.x - L.c.x, camera.position.z - L.c.z);
    if (d < best) { best = d; focus = L.name; }
  }
  const fEl = document.getElementById('hFocus');
  if (fEl.textContent !== focus) fEl.textContent = focus;

  /* —— FPS —— */
  state.frames++; state.fpsT += dt;
  if (state.fpsT >= 0.5) {
    state.fps = Math.round(state.frames / state.fpsT);
    document.getElementById('hFps').textContent = state.fps + ' FPS';
    state.frames = 0; state.fpsT = 0;
  }

  /* —— 手势识别（每帧） —— */
  updateHandState(nowMs, dt);

  renderer.render(scene, camera);
}

/* ============================================================================
   ███ 启动
============================================================================ */
initThree();
initLandmarkEffects();
initRings();
initBackground();
initPetals();
initLakeLotus();
initHiddenEasterEgg();
bindAudioUI();
document.getElementById('hCount').textContent = TOTAL.toLocaleString();
animate();
initMediaPipe().finally(() => document.getElementById('loading').classList.add('hide'));
setTimeout(() => document.getElementById('loading').classList.add('hide'), 9000);
</script>
